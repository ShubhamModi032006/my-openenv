[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email-triage-openenv"
version = "0.1.0"
description = "An OpenEnv-compliant Email Triage AI environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.2",
    "pydantic>=2.4.2",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "python-dotenv",
    "openai",
    "openenv>=0.2.0"
]

[project.scripts]
server = "server.app:app"

[project.optional-dependencies]
test = [
    "pytest>=7.4.2"
]
